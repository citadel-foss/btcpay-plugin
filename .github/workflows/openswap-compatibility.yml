name: OpenSwap master compatibility
run-name: BTCPay plugin against OpenSwap ${{ github.event.client_payload.openswap_sha || inputs.openswap_sha || 'latest master' }}

on:
  repository_dispatch:
    types: [openswap-updated]
  workflow_dispatch:
    inputs:
      openswap_sha:
        description: Full OpenSwap master SHA; leave empty for the latest master commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: btcpay-plugin-openswap-master
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  NO_COLOR: "1"
  RUST_BACKTRACE: "1"

jobs:
  resolve:
    name: Resolve OpenSwap master commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.context.outputs.sha }}
    steps:
      - name: Validate upstream commit
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.client_payload.openswap_sha }}
          DISPATCH_REF: ${{ github.event.client_payload.openswap_ref }}
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.openswap_repository }}
          MANUAL_SHA: ${{ inputs.openswap_sha }}
        shell: bash
        run: |
          set -euo pipefail
          upstream="citadel-foss/openswap"
          if [[ "${EVENT_NAME}" == repository_dispatch ]]; then
            if [[ "${DISPATCH_REF}" != refs/heads/master || "${DISPATCH_REPOSITORY}" != "${upstream}" ]]; then
              echo "::error::Expected a dispatch from citadel-foss/openswap master."
              exit 1
            fi
            sha="${DISPATCH_SHA}"
          else
            sha="${MANUAL_SHA}"
            if [[ -z "${sha}" ]]; then
              sha="$(gh api "repos/${upstream}/commits/master" --jq .sha)"
            fi
          fi
          if [[ ! "${sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::openswap_sha must be a full 40-character Git SHA."
            exit 1
          fi
          sha="${sha,,}"
          ancestor="$(gh api "repos/${upstream}/compare/${sha}...master" --jq .merge_base_commit.sha)"
          if [[ "${ancestor}" != "${sha}" ]]; then
            echo "::error::${sha} is not a commit on OpenSwap master."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          printf 'Building BTCPay plugin against [OpenSwap `%s`](https://github.com/%s/commit/%s).\n' \
            "$sha" "$upstream" "$sha" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and pin compatible OpenSwap commit
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OPENSWAP_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Pin and verify OpenSwap commit
        run: python3 .github/scripts/pin-openswap.py

      - name: CI helper tests
        run: python3 -m unittest discover -s .github/scripts -p test_compatibility.py

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build native plugin
        run: cargo build --release --locked

      - name: Commit compatible dependency pin
        if: github.ref == 'refs/heads/main'
        run: bash .github/scripts/promote-openswap.sh

  report:
    name: Report compatibility failure
    needs: [resolve, build]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.resolve.result == 'success' && needs.build.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      OPENSWAP_SHA: ${{ needs.resolve.outputs.sha }}
      PLUGIN_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create or update issue with build errors
        run: python3 .github/scripts/report-compatibility.py

      - name: Upload complete failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcpay-plugin-compatibility-failure-${{ needs.resolve.outputs.sha }}
          path: compatibility-report/
          if-no-files-found: warn
          retention-days: 14
